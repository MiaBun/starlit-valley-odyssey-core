name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: build/libs

      - name: Get version from changelog
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m 1 -oP '(?<=## \[)[^]]+' CHANGELOG.md | head -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Rename artifact
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}

          cd build/libs

          FILE=$(ls *.jar | head -n 1)

          mv "$FILE" "svo-${VERSION}.jar"

          echo "Renamed to svo-${VERSION}.jar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: build/libs/svo-${{ steps.version.outputs.version }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}

          awk "/## \[$VERSION\]/ {flag=1; next} /## \[/ && flag==1 {flag=0} flag" CHANGELOG.md > changelog.txt

          echo "text<<EOF" >> $GITHUB_OUTPUT
          cat changelog.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Discord message
        uses: hugoalh/send-discord-webhook-ghaction@v7.0.5
        with:
        key: ${{ secrets.discord_webhook }}
        username: "Core Mod"
        avatar_url: "https://media.forgecdn.net/avatars/thumbnails/798/822/64/64/638160732420962168.png"
        content_links_no_embed: .+
        content: |
          **Release**: `${{ steps.version.outputs.version }}`
          **Game Version**: `1.20.1`

          [GitHub](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}) • [Issues](https://github.com/${{ github.repository }}/issues)

          ```markdown
          ${{ steps.changelog.outputs.text }}
          ```

          **[Read more](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }})**
